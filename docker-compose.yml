version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: plum-ai-db
    environment:
      POSTGRES_USER: ${DB_USER:-plum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plum_password}
      POSTGRES_DB: ${DB_NAME:-plum_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plum_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plum-network

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: plum-ai-chromadb
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plum-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: plum-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-plum_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-plum_minio_secret_change_in_prod}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - plum-network

  # One-shot init container: creates the default bucket on first start
  createbuckets:
    image: minio/mc:latest
    container_name: plum-ai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set plumminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
        mc mb --ignore-existing plumminio/$${MINIO_BUCKET_NAME};
        mc anonymous set download plumminio/$${MINIO_BUCKET_NAME};
        echo 'MinIO bucket ready.';
        exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-plum_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-plum_minio_secret_change_in_prod}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-plum-documents}
    networks:
      - plum-network

  # Backend FastAPI Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plum-ai-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-plum_user}:${DB_PASSWORD:-plum_password}@postgres:5432/${DB_NAME:-plum_ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: http://frontend:5173
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:5173"]'
      # MinIO / S3-compatible storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-plum_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-PlumAI@Minio2024!}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-plum-documents}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      # Ollama local LLM — points to the Windows host machine
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
    extra_hosts:
      # Allows Docker container to reach Ollama running on Windows host
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plum-network

  # Frontend React Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: plum-ai-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plum-network

  # Redis for caching and session management (optional)
  redis:
    image: redis:7-alpine
    container_name: plum-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plum-network

volumes:
  postgres_data:
    driver: local
  chromadb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  plum-network:
    driver: bridge
